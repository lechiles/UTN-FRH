<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cursada Ingeniería Industrial</title>
<meta name="theme-color" content="#0E1222">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cursada">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: app de estudio — barra lateral fija en escritorio, barra inferior con íconos en el celu; tarjetas blancas con aire sobre un fondo neutro frío. */
:root{
  --bg:#F3F4F8; --surface:#FFFFFF; --surface-2:#F0F2F7; --ink:#0E1222; --muted:#636A80; --line:#E3E6EE; --line-strong:#CBD1DD;
  --accent:#3355FF; --accent-ink:#FFFFFF; --accent-soft:#E9EDFF;
  --ok:#0F9963; --ok-soft:#E2F5EC; --warn:#C97A06; --warn-soft:#FFF2DB; --crit:#DC3B41; --crit-soft:#FDEBEC;
  --hero:#0E1222; --hero-ink:#F3F4F8; --hero-muted:#A7AEC4;
  --shadow:0 1px 2px rgba(14,18,34,.04),0 2px 8px rgba(14,18,34,.05);
  --ml:42%; --ms:70%; --mbg:95%;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Geist",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"Geist Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
  --r:14px; --r-sm:10px; --side:236px; --bnav:64px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A0D16; --surface:#131826; --surface-2:#1A2032; --ink:#E9ECF5; --muted:#949BB1; --line:#232A3E; --line-strong:#353E58;
  --accent:#7D95FF; --accent-ink:#0A0D16; --accent-soft:#1D2547;
  --ok:#3DD68C; --ok-soft:#12301F; --warn:#F2B04A; --warn-soft:#382A12; --crit:#FF6B6F; --crit-soft:#3B1A1C;
  --hero:#1C2340; --hero-ink:#F3F4F8; --hero-muted:#AEB6D2;
  --shadow:0 1px 2px rgba(0,0,0,.3);
  --ml:72%; --ms:75%; --mbg:19%; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0A0D16; --surface:#131826; --surface-2:#1A2032; --ink:#E9ECF5; --muted:#949BB1; --line:#232A3E; --line-strong:#353E58;
  --accent:#7D95FF; --accent-ink:#0A0D16; --accent-soft:#1D2547;
  --ok:#3DD68C; --ok-soft:#12301F; --warn:#F2B04A; --warn-soft:#382A12; --crit:#FF6B6F; --crit-soft:#3B1A1C;
  --hero:#1C2340; --hero-ink:#F3F4F8; --hero-muted:#AEB6D2;
  --shadow:0 1px 2px rgba(0,0,0,.3);
  --ml:72%; --ms:75%; --mbg:19%; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
h1,h2,h3{font-family:var(--f-display);font-weight:700;line-height:1.12;text-wrap:balance;margin:0;letter-spacing:-.02em}
h1{font-size:2.1rem} h2{font-size:1.2rem;letter-spacing:-.01em} h3{font-size:1.05rem;letter-spacing:-.01em}
.mono,.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* estructura: barra lateral + contenido */
.side{position:fixed;top:0;bottom:0;left:0;width:var(--side);background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:22px;padding:calc(20px + env(safe-area-inset-top,0px)) 14px calc(16px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px));z-index:6}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px}
.logo{width:36px;height:36px;border-radius:10px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:.8rem;letter-spacing:.02em;flex:none}
.brand b{display:block;font-family:var(--f-display);font-size:1.05rem;letter-spacing:-.01em;line-height:1.1}
.brand span{font-size:.78rem;color:var(--muted)}
.navlinks{display:flex;flex-direction:column;gap:2px}
.navlinks a{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:var(--r-sm);color:var(--muted);text-decoration:none;font-weight:500;font-size:.93rem}
.navlinks a svg{width:19px;height:19px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.navlinks a:hover{background:var(--surface-2);color:var(--ink)}
.navlinks a[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.side .sync{margin-top:auto;padding:0 8px}
.main{margin-left:var(--side);max-width:1240px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px));padding-block:30px 72px;display:flex;flex-direction:column;gap:22px}
.mtop{display:none}
.sync{font-size:.75rem;color:var(--muted);display:flex;align-items:center;gap:7px;white-space:nowrap;min-width:0}
.sync span{overflow:hidden;text-overflow:ellipsis}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--ok);display:inline-block;flex:none}
.sync.busy i{background:var(--warn)} .sync.err i{background:var(--crit)} .sync.local i{background:var(--muted)}
@media (max-width:960px){
  .side{top:auto;right:0;width:auto;height:auto;flex-direction:row;padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));border-right:0;border-top:1px solid var(--line);gap:0}
  .side .brand,.side .sync{display:none}
  .navlinks{flex-direction:row;overflow-x:auto;scrollbar-width:none;width:100%;justify-content:space-between;gap:0}
  .navlinks a{flex-direction:column;gap:3px;padding:6px 8px;font-size:.68rem;min-width:58px;text-align:center}
  .navlinks a[aria-current="page"]{background:none}
  .navlinks a[aria-current="page"] svg{background:var(--accent-soft);border-radius:999px;padding:3px 12px;width:46px;height:26px}
  .mtop{display:flex;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line);align-items:center;gap:10px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .mtop .brand{padding:0;margin-right:auto}
  .mtop .logo{width:30px;height:30px;font-size:.7rem}
  .main{margin-left:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px calc(var(--bnav) + 40px + env(safe-area-inset-bottom,0px))}
  h1{font-size:1.65rem}
}

.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap}
.pagehead p{margin:6px 0 0;color:var(--muted);max-width:62ch}
.eyebrow{font-size:.78rem;font-weight:600;color:var(--accent);margin-bottom:4px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;min-width:0;box-shadow:var(--shadow)}
.panel>header{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.panel>header p{margin:0;color:var(--muted);font-size:.85rem}
.cols{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:22px;align-items:start}
.stack{display:flex;flex-direction:column;gap:22px;min-width:0}
@media (max-width:1100px){.cols{grid-template-columns:minmax(0,1fr)}}

/* botones y campos */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line-strong);background:var(--surface);padding:7px 14px;border-radius:var(--r-sm);cursor:pointer;font-weight:550;font-size:.88rem;white-space:nowrap;text-decoration:none;color:var(--ink);box-shadow:0 1px 1px rgba(14,18,34,.04)}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);box-shadow:0 1px 2px rgba(51,85,255,.25)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted);box-shadow:none}
.btn.ghost:hover{color:var(--crit)}
.btn.sm{padding:4px 10px;font-size:.8rem;border-radius:8px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
input[type=text],input[type=number],input[type=date],input[type=url],input[type=time],select,textarea{background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--r-sm);padding:7px 10px;min-width:0;max-width:100%}
textarea{width:100%;min-height:90px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.form{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.form .grow{flex:1 1 220px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.78rem;color:var(--muted);font-weight:500}
label.f input,label.f select{color:var(--ink);font-size:.92rem;font-weight:400}
.chk{display:inline-flex;align-items:center;gap:7px;cursor:pointer}
.chk input{width:16px;height:16px;accent-color:var(--accent)}

/* chips y estados */
.chip{display:inline-flex;align-items:center;gap:5px;font-size:.74rem;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap;font-weight:550}
.chip.crit{background:var(--crit-soft);color:var(--crit)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.acc{background:var(--accent-soft);color:var(--accent)}
.dot{width:9px;height:9px;border-radius:50%;background:hsl(var(--mh) var(--ms) var(--ml));flex:none;display:inline-block}
.mtag{display:inline-flex;align-items:center;gap:7px;font-weight:600;color:var(--ink);text-decoration:none}
.muted{color:var(--muted)} .small{font-size:.82rem}
.empty{padding:22px;border:1.5px dashed var(--line-strong);border-radius:var(--r);color:var(--muted);text-align:center;font-size:.9rem}

/* barra de progreso */
.bar{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden;display:flex}
.bar>span{display:block;height:100%}
.bar .d{background:var(--ok)} .bar .c{background:var(--warn)}

/* arranque */
.hero{background:var(--hero);color:var(--hero-ink);border-radius:20px;padding:24px 26px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px 28px;align-items:center}
.hero .eyebrow{color:var(--hero-muted)}
.hero h2{font-size:1.6rem;letter-spacing:-.02em;color:var(--hero-ink)}
.hero p{margin:6px 0 0;color:var(--hero-muted);font-size:.92rem}
.hero .acts{display:flex;gap:8px;flex-wrap:wrap}
.hero .btn{border-color:rgba(255,255,255,.25);background:transparent;color:var(--hero-ink);box-shadow:none}
.hero .btn.primary{background:var(--hero-ink);color:var(--hero);border-color:var(--hero-ink)}
.racha{display:flex;align-items:center;gap:10px;font-size:.82rem;color:var(--hero-muted);grid-column:1/-1;flex-wrap:wrap}
.racha .d7{display:flex;gap:5px}
.racha .d7 i{width:22px;height:22px;border-radius:7px;background:rgba(255,255,255,.1);display:grid;place-items:center;font-style:normal;font-size:.62rem;color:var(--hero-muted)}
.racha .d7 i.on{background:var(--ok);color:#06281A}
@media (max-width:700px){.hero{grid-template-columns:minmax(0,1fr);padding:20px}.hero h2{font-size:1.3rem}}

/* prioridades */
.prio{display:flex;flex-direction:column}
.prio a.row{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 8px;border-top:1px solid var(--line);text-decoration:none;color:inherit;border-radius:var(--r-sm)}
.prio a.row:first-child{border-top:0}
.prio a.row:hover{background:var(--surface-2)}
.rank{font-family:var(--f-mono);font-size:.95rem;color:var(--muted);text-align:center}
.prio .why{font-size:.82rem;color:var(--muted);margin-top:2px}
.score{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:4px}

/* evaluaciones próximas */
.evs{display:flex;flex-direction:column;gap:8px}
.ev{display:grid;grid-template-columns:54px minmax(0,1fr) auto;gap:12px;align-items:center;padding:8px 10px;border-radius:var(--r-sm);background:var(--surface-2)}
.cal{text-align:center;background:var(--surface);border-radius:10px;padding:6px 0;box-shadow:var(--shadow)}
.cal b{display:block;font-family:var(--f-display);font-size:1.35rem;line-height:1}
.cal span{font-size:.66rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.ev.crit .cal b{color:var(--crit)} .ev.warn .cal b{color:var(--warn)}

/* plan */
.days{display:flex;flex-direction:column;gap:12px}
.day{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.day>header{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 14px;border-bottom:1px solid var(--line)}
.day>header h3{font-size:1rem;margin-right:auto}
.day.today{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.slots{display:flex;flex-direction:column}
.slot{display:grid;grid-template-columns:62px minmax(0,1fr) auto;gap:12px;padding:12px 14px;border-top:1px solid var(--line);align-items:start}
.slot:first-child{border-top:0}
.slot .len{font-family:var(--f-mono);font-size:.8rem;color:var(--muted);padding-top:1px}
.slot ul{margin:5px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px;font-size:.88rem}
.slot li{display:flex;gap:7px;align-items:flex-start}
.slot li input{margin-top:3px;accent-color:var(--accent)}
.slot.done{opacity:.55}
.slot.libre{color:var(--muted);font-size:.88rem}
.slot.rep{background:var(--surface-2)}
@media (max-width:600px){.slot{grid-template-columns:50px minmax(0,1fr)}.slot>:nth-child(3){grid-column:2;flex-direction:row!important;justify-content:flex-start;flex-wrap:wrap}}
.alerts{display:flex;flex-direction:column;gap:8px}
.alert{padding:11px 14px;border-radius:var(--r-sm);font-size:.88rem;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.alert.crit{background:var(--crit-soft);color:var(--crit)}
.alert.warn{background:var(--warn-soft);color:var(--warn)}
.alert.info{background:var(--accent-soft);color:var(--accent)}
.alert span{flex:1 1 240px;min-width:0}
.alert .btn{flex:none}

/* tarjetas de materias */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
a.mcard{display:flex;flex-direction:column;gap:12px;padding:18px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);text-decoration:none;color:inherit;box-shadow:var(--shadow);position:relative;overflow:hidden}
a.mcard::before{content:"";position:absolute;inset:0 0 auto;height:4px;background:hsl(var(--mh) var(--ms) var(--ml))}
a.mcard:hover{border-color:var(--line-strong);transform:translateY(-1px)}
.mcard h3{font-size:1.2rem}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kv div{display:flex;flex-direction:column}
.kv b{font-family:var(--f-mono);font-size:1rem;font-weight:500}
.kv span{font-size:.72rem;color:var(--muted)}

/* detalle de materia */
.mhead{display:flex;flex-direction:column;gap:12px;padding:22px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);position:relative;overflow:hidden}
.mhead::before{content:"";position:absolute;inset:0 auto 0 0;width:5px;background:hsl(var(--mh) var(--ms) var(--ml))}
.mhead .line{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.subtabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;background:var(--surface-2);padding:4px;border-radius:12px;width:fit-content;max-width:100%}
.subtabs button{border:0;background:none;padding:7px 13px;cursor:pointer;color:var(--muted);font-weight:550;border-radius:9px;white-space:nowrap;font-size:.88rem}
.subtabs button[aria-selected="true"]{color:var(--ink);background:var(--surface);box-shadow:var(--shadow)}
.list{display:flex;flex-direction:column}
.item{display:flex;gap:10px;align-items:center;padding:10px 2px;border-top:1px solid var(--line);flex-wrap:wrap}
.item:first-child{border-top:0}
.item .t{flex:1 1 220px;min-width:0;overflow-wrap:anywhere}
.item.done .t{text-decoration:line-through;color:var(--muted)}
.seg{display:inline-flex;background:var(--surface-2);border-radius:10px;padding:3px;gap:2px;flex:none}
.seg button{border:0;background:none;padding:4px 10px;font-size:.78rem;cursor:pointer;color:var(--muted);border-radius:7px;font-weight:550}
.seg button.on{background:var(--surface);box-shadow:var(--shadow)}
.seg button.on.p{color:var(--crit)}
.seg button.on.e{color:var(--warn)}
.seg button.on.d{color:var(--ok)}
.group-h{font-size:.76rem;font-weight:600;color:var(--muted);margin:16px 0 2px}
.evcard{border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:10px;background:var(--surface)}
.evcard .line{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.temas-pick{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:.86rem}
details.box{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;background:var(--surface-2)}
details.box summary{cursor:pointer;font-weight:600}
details.box[open] summary{margin-bottom:12px}
.box2{border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;background:var(--surface-2)}

/* horas */
.hbars{display:flex;flex-direction:column;gap:9px}
.hbar{display:grid;grid-template-columns:minmax(0,160px) minmax(0,1fr) 56px;gap:10px;align-items:center;font-size:.86rem}
.hbar .trk{height:10px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.hbar .trk span{display:block;height:100%;border-radius:99px;background:hsl(var(--mh) var(--ms) var(--ml))}
.hbar .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow)}
.stat b{display:block;font-family:var(--f-display);font-size:1.6rem;line-height:1.1;letter-spacing:-.02em}
.stat span{font-size:.78rem;color:var(--muted)}
.panel .stat{box-shadow:none;background:var(--surface-2);border-color:transparent}
@media (max-width:700px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* tablas */
.tablewrap{overflow-x:auto}
table.disp{border-collapse:collapse;width:100%;min-width:520px;font-size:.9rem}
table.disp th,table.disp td{padding:8px 8px;border-bottom:1px solid var(--line);text-align:left}
table.disp th{font-size:.74rem;color:var(--muted);font-weight:600}
table.disp input[type=number]{width:80px}
table.disp input[type=text]{width:140px}
select.chip-sel{font-size:.8rem;padding:4px 10px;border-radius:999px;max-width:200px;border-color:transparent;background:var(--surface-2)}
select.chip-sel.ok{background:var(--ok-soft);color:var(--ok)}
select.chip-sel.warn{background:var(--warn-soft);color:var(--warn)}
select.chip-sel.acc{background:var(--accent-soft);color:var(--accent)}
.linkbtn{border:0;background:none;padding:0;color:var(--accent);text-decoration:underline;cursor:pointer;font:inherit;text-align:left}

/* superposiciones */
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:.88rem;z-index:20;max-width:calc(100% - 32px);box-shadow:0 8px 24px rgba(0,0,0,.18)}
.overlay{position:fixed;inset:0;background:rgba(8,11,20,.5);z-index:15;display:flex;align-items:center;justify-content:center;padding:16px}

function persist(){
  cacheLocal();

  setSync("Guardando…","busy");clearTimeout(saveTimer);saveTimer=setTimeout(flush,500);

/* cada parte del estado se guarda en su propia fila: así no hay límite de tamaño y cada cambio escribe solo lo que se modificó */
function partes(st){const p={meta:{v:st.v||1,creado:st.creado||""},config:st.config,carrera:st.carrera,historial:{items:st.historial||[]}};
  st.materias.forEach((m,i)=>p["materia:"+m.id]=Object.assign({},m,{_orden:i}));(st.archivo||[]).forEach(m=>p["archivo:"+m.id]=m);return p}
function unir(rows){const st={v:1,materias:[],archivo:[],historial:[]},ms=[];
  rows.forEach(r=>{const k=r.key,d=r.data;if(k==="meta"){st.v=d.v||1;st.creado=d.creado}else if(k==="config")st.config=d;else if(k==="carrera")st.carrera=d;else if(k==="historial")st.historial=d.items||[];else if(k.startsWith("materia:"))ms.push(d);else if(k.startsWith("archivo:"))st.archivo.push(d)});
  ms.sort((a,b)=>(a._orden||0)-(b._orden||0));ms.forEach(m=>delete m._orden);st.materias=ms;return st}
async function flush(){
  saveTimer=null;if(saving){again=true;return}saving=true;
  try{
    const p=partes(state),ups=[],dels=[],ahora=new Date().toISOString();
    for(const k in p){const j=JSON.stringify(p[k]);if(remoto[k]!==j)ups.push({user_id:usuario.id,key:k,data:p[k],updated_at:ahora})}
    for(const k in remoto)if(!(k in p))dels.push(k);
    if(ups.length){const{error}=await sb.from(TABLA).upsert(ups,{onConflict:"user_id,key"});if(error)throw error;ups.forEach(u=>remoto[u.key]=JSON.stringify(u.data))}
    if(dels.length){const{error}=await sb.from(TABLA).delete().eq("user_id",usuario.id).in("key",dels);if(error)throw error;dels.forEach(k=>delete remoto[k])}
    setSync("Guardado","");
  }catch(e){console.error(e);setSync("No se pudo guardar. Se vuelve a intentar solo.","err");setTimeout(()=>{if(usuario)persist()},15000)}
  saving=false;if(again){again=false;flush()}
}

function migrate(s){
  if(!s||!Array.isArray(s.materias))return null;
  s=JSON.parse(JSON.stringify(s));
  s.config=s.config||plantilla().config;s.config.excepciones=s.config.excepciones||[];
  const c0=s.config;c0.ingreso=c0.ingreso||2025;c0.regAnios=c0.regAnios||2;c0.mesas=c0.mesas||[];c0.horario=c0.horario||[];c0.cierres=c0.cierres||{};
  c0.ventana=c0.ventana||{semana:{desde:"14:00",hasta:"23:30"},finde:{desde:"09:00",hasta:"21:00"}};
  s.archivo=s.archivo||[];s.historial=s.historial||[];
  {const al0=(()=>{const d=new Date();return d.getMonth()<3?d.getFullYear()-1:d.getFullYear()})();c0.asist=c0.asist||{min:75,desde:al0+"-03-16",hasta:al0+"-11-27"}}
  s.materias.forEach(m=>{m.asist=m.asist||{};m.simulacros=m.simulacros||[];m.fichas=m.fichas||[]});
  s.materias.forEach(m=>{["temas","tareas","evaluaciones","apuntes","ejercicios","sesiones","examenes"].forEach(k=>m[k]=m[k]||[]);m.temas.forEach(t=>{if(t.estado==="dominado"&&!t.proxRep){t.rep=t.rep||0;t.proxRep=iso(addDays(parseISO(hoyISO()),INTERV[0]))}})});
  if(!s.carrera){
    s.carrera={estados:{},extras:[]};
    const norm=x=>String(x).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").trim();
    s.materias.forEach(m=>{const p=PLAN.find(p=>norm(p[1])===norm(m.nombre));if(p)s.carrera.estados[p[0]]={estado:m.tipo==="final"?"regular":"cursando",mid:m.id}});
  }
  s.carrera.estados=s.carrera.estados||{};s.carrera.extras=s.carrera.extras||[];
  return sanear(s);
}
function sanear(s){
  const hhmm=v=>/^\d{1,2}:\d{2}$/.test(String(v||""))?String(v):"";
  const fecha=v=>/^\d{4}-\d{2}-\d{2}$/.test(String(v||""))?String(v):"";
  const num=v=>v===null||v===undefined||v===""?null:(isFinite(+v)?+v:null);
  const link=v=>/^https?:\/\//i.test(String(v||""))?String(v):"";
  const idok=v=>String(v==null?"":v).replace(/[^A-Za-z0-9_-]/g,"");
  (s.config.horario||[]).forEach(c=>{c.id=idok(c.id);c.desde=hhmm(c.desde)||"00:00";c.hasta=hhmm(c.hasta)||"00:00";c.mid=idok(c.mid)});
  (s.config.mesas||[]).forEach(m=>{m.id=idok(m.id);m.desde=fecha(m.desde);m.hasta=fecha(m.hasta);m.inscHasta=fecha(m.inscHasta)});
  (s.config.excepciones||[]).forEach(e=>{e.fecha=fecha(e.fecha);e.min=num(e.min)||0});
  s.materias.concat(s.archivo||[]).forEach(m=>{
    m.id=idok(m.id);m.mh=isFinite(+m.mh)?Math.abs(+m.mh)%360:220;m.dificultad=[1,2,3].includes(+m.dificultad)?+m.dificultad:2;
    (m.temas||[]).forEach(t=>t.id=idok(t.id));
    (m.tareas||[]).forEach(t=>{t.id=idok(t.id);t.min=num(t.min)||30;t.temaId=idok(t.temaId)});
    (m.evaluaciones||[]).forEach(e=>{e.id=idok(e.id);e.nota=num(e.nota);e.fecha=fecha(e.fecha);e.temaIds=(e.temaIds||[]).map(idok)});
    (m.apuntes||[]).forEach(a=>{a.id=idok(a.id);if(a.url!=null)a.url=link(a.url);if(a.assetId)a.assetId=idok(a.assetId)});
    (m.examenes||[]).forEach(e=>{e.id=idok(e.id);if(e.url!=null)e.url=link(e.url);if(e.assetId)e.assetId=idok(e.assetId);const n=num(e.anio);e.anio=n==null?"":n;e.temaIds=(e.temaIds||[]).map(idok)});
    (m.ejercicios||[]).forEach(x=>{x.id=idok(x.id);x.temaId=idok(x.temaId)});
    (m.sesiones||[]).forEach(x=>{x.id=idok(x.id);x.min=num(x.min)||0;x.fecha=fecha(x.fecha)});
    (m.fichas||[]).forEach(f=>{f.id=idok(f.id);f.temaId=idok(f.temaId)});
    (m.simulacros||[]).forEach(x=>{x.id=idok(x.id);x.exId=idok(x.exId);x.min=num(x.min)||0;x.nota=num(x.nota)});
  });
  Object.keys(s.carrera.estados).forEach(k=>{if(!/^\d+$/.test(k)){delete s.carrera.estados[k];return}const e=s.carrera.estados[k];e.nota=num(e.nota);if(e.mid)e.mid=idok(e.mid)});
  (s.carrera.extras||[]).forEach(x=>{x.id=idok(x.id);x.nota=num(x.nota)});
  (s.historial||[]).forEach(x=>{x.id=idok(x.id);x.nota=num(x.nota);x.fecha=fecha(x.fecha)});
  return s;
}

async function cargarRemoto(){
  const{data,error}=await sb.from(TABLA).select("key,data").eq("user_id",usuario.id);if(error)throw error;
  Object.keys(remoto).forEach(k=>delete remoto[k]);data.forEach(r=>remoto[r.key]=JSON.stringify(r.data));
  return data.length?migrate(unir(data)):null;
}

}}

/* ---------- cálculos ---------- */
const getM=id=>state?state.materias.find(m=>m.id===id):null;
const temaNombre=(m,id)=>(m.temas.find(t=>t.id===id)||{}).nombre||"";
function progreso(m){
  if(!m.temas.length)return{d:0,c:0,p:0,total:0,pct:0};
  const d=m.temas.filter(t=>t.estado==="dominado").length,c=m.temas.filter(t=>t.estado==="encurso").length;
  return{d,c,p:m.temas.length-d-c,total:m.temas.length,pct:(d+c*.5)/m.temas.length};
}
function proxEval(m){
  const h=hoyISO();
  return m.evaluaciones.filter(e=>e.estado==="pendiente"&&e.fecha&&e.fecha>=h).sort((a,b)=>a.fecha.localeCompare(b.fecha))[0]||null;
}
function temasDe(m,ev){
  if(ev&&ev.temaIds&&ev.temaIds.length){const s=new Set(ev.temaIds);return m.temas.filter(t=>s.has(t.id))}
  return m.temas;
}
const FDIF={1:.8,2:1,3:1.3};
const esFinalEx=e=>e.tipo==="final";
/* qué banco usar para una materia: modelos de final si lo próximo es un final (o es un final pendiente), si no parciales; con menos de 2 clasificados, todos juntos */
function modoBanco(m){const ev=proxEval(m);return (ev?ev.tipo==="final":m.tipo==="final")?"final":"parcial"}
function frecuencias(m,modo){
  if(modo===undefined){const mo=modoBanco(m),f=frecuencias(m,mo);return f.n>=2?Object.assign(f,{modo:mo}):Object.assign(frecuencias(m,"todos"),{modo:"todos"})}
  const ex=(m.examenes||[]).filter(e=>(e.temaIds||[]).length&&(modo==="todos"||(modo==="final")===esFinalEx(e))),c={};ex.forEach(e=>e.temaIds.forEach(id=>c[id]=(c[id]||0)+1));return{c,n:ex.length}}
/* con 2 o más parciales clasificados, los temas que más se toman reciben hasta 40% más de tiempo y los que nunca aparecieron, 20% menos */
function pesoTema(m,t){const{c,n}=frecuencias(m);if(n<2)return 1;return .8+.6*((c[t.id]||0)/n)}
function proxRepaso(m,t){
  if(t.estado!=="dominado")return null;
  const h=hoyISO();let due=t.proxRep||iso(addDays(parseISO(h),INTERV[0]));
  const ev=proxEval(m);
  if(ev&&temasDe(m,ev).includes(t)){const ult=t.ultRep||t.domDesde||"";if(!ult||diasEntre(ult,ev.fecha)>7){let lim=iso(addDays(parseISO(ev.fecha),-2));if(lim<h)lim=h;if(lim<due)due=lim}}
  return due;
}
/* cola de trabajo concreta para una evaluación: tareas pendientes, ejercicios y temas sin dividir */
function cola(m,ev){
  const out=[];
  for(const t of temasDe(m,ev)){
    if(t.estado==="dominado")continue;
    const i0=out.length;
    const ts=m.tareas.filter(x=>x.temaId===t.id&&!x.hecha);
    ts.forEach(x=>out.push({kind:"tarea",id:x.id,texto:x.texto,min:+x.min||30,tema:t.nombre}));
    const ej=m.ejercicios.filter(x=>x.temaId===t.id&&x.estado!=="hecho");
    if(ej.length)out.push({kind:"ej",texto:"Ejercicios de "+t.nombre+" ("+ej.length+" pendientes)",min:Math.min(120,ej.length*15)});
    if(!ts.length&&!ej.length)out.push({kind:"tema",texto:(t.estado==="encurso"?"Afianzar: ":"Estudiar: ")+t.nombre,min:t.estado==="encurso"?45:90});
    const w=pesoTema(m,t);for(let i=i0;i<out.length;i++)out[i].w=w;
  }
  if(!ev||!ev.temaIds||!ev.temaIds.length)m.tareas.filter(x=>!x.temaId&&!x.hecha).forEach(x=>out.push({kind:"tarea",id:x.id,texto:x.texto,min:+x.min||30}));
  const f=FDIF[m.dificultad]||1;
  out.forEach(o=>o.min=Math.round(o.min*f*(o.w||1)));
  if(ev)out.push({kind:"repaso",texto:"Repaso general y simulacro para el "+(ev.nombre||TIPO_EV[ev.tipo]).toLowerCase(),min:60});
  return out;
}
const demanda=(m,ev)=>cola(m,ev).reduce((a,o)=>a+o.min,0);
function minDia(d){
  const f=iso(d),c=state.config,ex=c.excepciones.find(e=>e.fecha===f);
  return ex?(+ex.min||0):(+c.dias[DK[d.getDay()]].min||0);
}
function dispEntre(desde,hasta){ /* minutos disponibles desde (incl.) hasta (excl.) */
  let tot=0,d=parseISO(desde);const h=parseISO(hasta);
  for(let i=0;i<120&&d<h;i++){tot+=minDia(d);d=addDays(d,1)}
  return tot;
}
const PESO={recuperatorio:1.3,parcial:1,final:1,tp:.7};
function prioridad(m){
  const p=progreso(m),ev=proxEval(m);
  if(!ev){
    const s=m.tipo==="final"?(1-p.pct)*6:(1-p.pct)*12;
    return{score:Math.round(s),ev:null,nivel:"baja",razon:m.tipo==="final"?"Sin mesa elegida":"Sin evaluaciones cargadas",dem:0,disp:0};
  }
  const d=diasHasta(ev.fecha),dem=demanda(m,ev),disp=dispEntre(hoyISO(),ev.fecha);
  const urg=Math.exp(-Math.max(0,d)/9),pres=Math.min(1.2,dem/Math.max(60,disp*.6));
  const score=Math.round(100*(PESO[ev.tipo]||1)*(.5*urg+.5*pres));
  const ts=temasDe(m,ev),pend=ts.filter(t=>t.estado!=="dominado").length;
  const nivel=d<=3||score>=70?"urgente":score>=45?"alta":score>=22?"media":"baja";
  return{score,ev,nivel,dem,disp,razon:(ev.nombre||TIPO_EV[ev.tipo])+" "+cuando(d)+" · "+pend+" de "+ts.length+" temas sin dominar · ~"+hm(dem)+" de estudio"};
}
const NIVEL={urgente:["crit","Urgente"],alta:["warn","Alta"],media:["acc","Media"],baja:["","Baja"]};

/* plan: reparte las sesiones de los próximos días entre materias según carga pendiente / tiempo disponible antes de cada evaluación */
function generarPlan(nd){
  const hoy=parseISO(hoyISO()),cfg=state.config;
  const obj=state.materias.filter(m=>m.condicion!=="aprobada"&&m.condicion!=="promocionada").map(m=>{
    const ev=proxEval(m);const q=cola(m,ev).map(o=>Object.assign({},o,{rest:o.min}));
    const tot=q.reduce((a,o)=>a+o.min,0);
    return{m,ev,fecha:ev?ev.fecha:null,q,rest:ev?tot:Math.round(tot*.15),peso:ev?(PESO[ev.tipo]||1):.2};
  });
  const reps=[];state.materias.filter(m=>m.condicion!=="aprobada"&&m.condicion!=="promocionada").forEach(m=>m.temas.forEach(t=>{const due=proxRepaso(m,t);if(due)reps.push({m,t,due,rep:t.rep||0})}));
  const dias=[];
  for(let i=0;i<nd;i++){
    const d=addDays(hoy,i),f=iso(d),dc=cfg.dias[DK[d.getDay()]],ex=cfg.excepciones.find(e=>e.fecha===f);
    const min=ex?(+ex.min||0):(+dc.min||0),finde=d.getDay()===0||d.getDay()===6;
    const len=Math.max(20,+(finde?cfg.larga:cfg.corta)||40);
    const ses=[];let left=min;
    const cap=Math.min(finde?60:30,Math.floor(min/2/15)*15);
    const tocan=reps.filter(r=>r.due<=f).sort((a,b)=>a.due.localeCompare(b.due)).slice(0,cap/15);
    if(tocan.length){
      tocan.forEach(r=>{r.rep++;r.due=iso(addDays(d,INTERV[Math.min(r.rep,INTERV.length-1)]))});
      ses.push({repaso:true,min:tocan.length*15,items:tocan.map(r=>({m:r.m,t:r.t})),key:f+"#r"});left-=tocan.length*15;
    }
    const slots=[];
    while(left>=20){let s=Math.min(len,left);if(left-s>0&&left-s<20)s=left;slots.push(s);left-=s}
    const evs=[];state.materias.forEach(m=>m.evaluaciones.forEach(e=>{if(e.fecha===f&&e.estado==="pendiente")evs.push({m,e})}));
    let last=null;
    slots.forEach((L,j)=>{
      let best=null,bs=0;
      for(const o of obj){
        if(o.rest<=0)continue;
        if(o.fecha&&o.fecha<=f)continue;
        let s;
        if(o.fecha){const disp=Math.max(L,dispEntre(f,o.fecha));s=o.peso*(o.rest/disp)+.25*Math.exp(-diasEntre(f,o.fecha)/7)}
        else s=.04;
        if(o===last)s*=finde?.85:.5;
        if(s>bs){bs=s;best=o}
      }
      if(!best){ses.push({libre:true,min:L,key:f+"#"+j});return}
      best.rest-=L;last=best;
      const items=[];let need=L;
      while(need>0&&best.q.length){
        const it=best.q[0],take=Math.min(need,it.rest);
        items.push({kind:it.kind,id:it.id,texto:it.texto,parcial:take<it.rest||it.rest<it.min});
        it.rest-=take;need-=take;if(it.rest<=0)best.q.shift();
      }
      if(!items.length)items.push({kind:"repaso",texto:"Repaso libre de "+best.m.nombre});
      ses.push({mid:best.m.id,min:L,items,ev:best.ev,key:f+"#"+j});
    });
    const hk=horarioTexto(DK[d.getDay()]);const dia={fecha:f,d,min,cursa:!ex&&(hk?true:dc.cursa),horario:hk||dc.horario,ex,finde,ses,evs};asignarHoras(dia);dias.push(dia);
  }
  const fin=iso(addDays(hoy,nd));
  const avisos=obj.filter(o=>o.fecha&&o.fecha<fin&&o.rest>0).map(o=>({m:o.m,ev:o.ev,falta:o.rest}));
  return{dias,avisos};
}

function cargarScript(src){return new Promise((ok,ko)=>{const sc=document.createElement("script");sc.src=src;const h=SRI[src.split("/").pop()];if(h){sc.integrity=h;sc.crossOrigin="anonymous"}sc.onload=ok;sc.onerror=()=>ko(new Error("No cargó "+src));document.head.appendChild(sc)})}

async function verArchivo(id,titulo){
  const r=$("#modal-root");let url="";try{url=await archivoURL(id)}catch(e){url=""}
  r.innerHTML='<div class="overlay viewer"><div class="vbox" role="dialog" aria-modal="true" aria-label="'+esc(titulo)+'"><header><b>'+esc(titulo)+'</b><span class="small muted" id="v-info"></span><button class="btn sm" id="v-zoom" hidden>Ampliar</button><button class="btn sm" id="v-close">Cerrar</button></header><div class="vbody" id="v-body"><div class="loading">Abriendo…</div></div></div></div>';
  visor={token:0,zoom:false,doc:null};const my=visor;
  $("#v-close").onclick=cerrarVisor;$("#v-close").focus();document.addEventListener("keydown",escVisor);
  const body=$("#v-body"),info=$("#v-info"),zb=$("#v-zoom");
  const falla=t=>{if(visor===my)body.innerHTML='<div class="empty">'+t+'</div>'};
  if(!url)return falla("Para ver archivos tenés que iniciar sesión.");
  let res;try{res=await fetch(url)}catch(e){return falla("No se pudo cargar el archivo. Revisá la conexión y probá de nuevo.")}
  if(visor!==my)return;
  if(!res.ok)return falla(res.status===404?"No se encontró el archivo: puede que se haya borrado.":"No se pudo cargar el archivo (error "+res.status+").");
  const ct=(res.headers.get("content-type")||"").toLowerCase();
  if(ct.startsWith("image/")){
    body.innerHTML='<img src="'+url+'" alt="'+esc(titulo)+'">';zb.hidden=false;
    zb.onclick=()=>{my.zoom=!my.zoom;body.classList.toggle("zoom",my.zoom);zb.textContent=my.zoom?"Ajustar":"Ampliar"};return;
  }
  if(!ct.includes("pdf"))return falla("Este tipo de archivo no se puede mostrar acá.");
  try{
    const buf=await res.arrayBuffer();const lib=await pdfjs();if(visor!==my)return;
    my.doc=await lib.getDocument({data:new Uint8Array(buf),isEvalSupported:false,disableFontFace:true,useSystemFonts:false}).promise;
  }catch(e){console.error(e);return falla("No se pudo abrir el PDF. Si es un escaneo muy pesado, probá subirlo como imagen.")}
  if(visor!==my)return;
  info.textContent=my.doc.numPages+(my.doc.numPages>1?" páginas":" página");zb.hidden=false;
  const pintar=async()=>{
    const t=++my.token;body.innerHTML="";
    const ancho=Math.max(280,body.clientWidth-24)*(my.zoom?1.8:1),dpr=Math.min(2,window.devicePixelRatio||1);
    for(let i=1;i<=my.doc.numPages;i++){
      if(my.token!==t||visor!==my)return;
      const page=await my.doc.getPage(i),v1=page.getViewport({scale:1}),sc=ancho/v1.width,vp=page.getViewport({scale:sc*dpr});
      const c=document.createElement("canvas");c.width=Math.floor(vp.width);c.height=Math.floor(vp.height);c.style.width=Math.floor(vp.width/dpr)+"px";c.style.height=Math.floor(vp.height/dpr)+"px";c.setAttribute("aria-label","Página "+i);
      body.appendChild(c);
      try{await page.render({canvasContext:c.getContext("2d"),viewport:vp}).promise}catch(e){console.error(e)}
    }
  };
  zb.onclick=()=>{my.zoom=!my.zoom;zb.textContent=my.zoom?"Ajustar":"Ampliar";pintar()};
  pintar();
}

  const m=ui.mid?getM(ui.mid):null,d=el.dataset;
  if(d.mfield&&m){let v=el.value;if(d.mfield==="nombre"&&!v.trim())return render();if(d.mfield==="dificultad")v=+v;m[d.mfield]=v;if(d.mfield==="condicion")sincCarrera(m);if(d.mfield==="tipo"){location.hash="#materia-"+m.id}commit("Guardado");return}
  if(d.tfield&&m){const t=m.temas.find(x=>x.id===d.id);if(!el.value.trim())return render();t.nombre=el.value.trim();m.temasSugeridos=false;commit("Tema renombrado");return}
  if(d.efield&&m){const ev=m.evaluaciones.find(x=>x.id===d.id);let v=el.value;
    if(d.efield==="nota"){ev.nota=v===""?null:+v;if(v!==""&&ev.estado!=="ausente")ev.estado=+v>=6?"aprobado":"desaprobado";
      if(ev.tipo==="final"&&ev.estado==="desaprobado"&&+v<6&&!state.historial.some(x=>x.evId===ev.id)){state.historial.push({id:uid(),evId:ev.id,fecha:ev.fecha||hoyISO(),n:nDeMid(m.id),nombre:m.nombre,res:"aplazo",nota:+v});commit("Quedó registrado el aplazo. La próxima sale.");return}
      if(ev.tipo==="final"&&ev.estado==="aprobado"){m.condicion="aprobada";sincCarrera(m);const k=Object.keys(state.carrera.estados).find(k=>state.carrera.estados[k].mid===m.id);if(k){state.carrera.estados[k].nota=+v;state.carrera.estados[k].fecha=ev.fecha}commit("¡Aprobaste "+m.nombre+"! Quedó registrada en tu carrera.");return}
      commit("Resultado guardado");return}
    ev[d.efield]=v;commit(d.efield==="fecha"?"Fecha actualizada: el plan se reajustó":"Guardado");return}
  if(d.carr==="regFecha"){const e=ce(+d.n);e.regFecha=el.value;e.vence=el.value?sumarAnios(el.value,state.config.regAnios):"";const m=e.mid&&getM(e.mid);if(m)m.vence=e.vence;commit(e.vence?"Vence el "+fechaCorta(e.vence):"Guardado");return}
  if(d.carr){const e=ce(+d.n);if(d.carr==="estado"){e.estado=el.value;sincMateria(+d.n);commit(nomC(+d.n)+": "+EST_C[el.value].toLowerCase())}else{e.nota=el.value===""?null:+el.value;commit("Nota guardada")}return}
  if(d.extra){const x=state.carrera.extras.find(y=>y.id===d.id);if(d.extra==="estado")x.estado=el.value;else x.nota=el.value===""?null:+el.value;commit("Guardado");return}
  if(el.id==="bk-file"&&el.files&&el.files[0]){restaurar(el.files[0]);el.value="";return}
  if(el.id==="bk-files"&&el.files&&el.files.length){subirArchivosCopia([...el.files]);el.value="";return}
  if(d.cierre){ui.cierre=ui.cierre||{};ui.cierre[d.k]=ui.cierre[d.k]||{};ui.cierre[d.k][d.cierre]=el.value;if(d.cierre==="res")render();return}
  if(d.asis){state.config.asist[d.asis]=d.asis==="min"?Math.max(0,Math.min(100,+el.value||75)):el.value;commit("Guardado");return}
  if(d.cfg){const v=+el.value;if(!v)return render();state.config[d.cfg]=v;commit("Guardado");return}
  if(d.ven){const[a,b]=d.ven.split(".");state.config.ventana[a][b]=el.value;commit("Ventana de estudio actualizada");return}
  if(d.dfield){const dd=state.config.dias[d.k];dd[d.dfield]=d.dfield==="cursa"?el.checked:d.dfield==="min"?Math.max(0,+el.value||0):el.value;commit("Disponibilidad actualizada: el plan se reajustó");return}
  if(d.cfield){state.config[d.cfield]=Math.max(20,+el.value||40);commit("Plan reajustado");return}
});
document.addEventListener("submit",async e=>{
  const f=e.target.closest("form[data-form]");if(!f)return;e.preventDefault();
  const fd=new FormData(f),k=f.dataset.form,m=ui.mid?getM(ui.mid):null;
  const tema=fd.get("tema")||"";if(fd.has("tema"))ui.lastTema=tema;
  switch(k){
    case "tema":{const n=String(fd.get("nombre")).trim();if(!n)return;m.temas.push({id:uid(),nombre:n,estado:"pendiente"});ui.refocus="f-tema";commit("Tema agregado");break}
    case "tarea":{const n=String(fd.get("texto")).trim();if(!n)return;m.tareas.push({id:uid(),texto:n,temaId:tema,min:+fd.get("min")||45,hecha:false});ui.refocus="f-tarea";commit("Tarea agregada");break}
    case "eval":{const fe=fd.get("fecha");if(!fe)return;m.evaluaciones.push({id:uid(),tipo:fd.get("tipo"),nombre:String(fd.get("nombre")||"").trim(),fecha:fe,temaIds:fd.getAll("temas"),recupera:fd.get("recupera")||"",nota:null,estado:"pendiente"});if(m.tipo==="final"&&fd.get("tipo")==="final"&&m.condicion==="libre"){}commit("Evaluación guardada: el plan se reajustó");break}
    case "ej":{const n=String(fd.get("texto")).trim();if(!n)return;m.ejercicios.push({id:uid(),texto:n,temaId:tema,estado:"pendiente"});ui.refocus="f-ej";commit("Ejercicio agregado");break}
    case "nota":m.apuntes.push({id:uid(),tipo:"nota",titulo:String(fd.get("titulo")).trim(),texto:String(fd.get("texto")||""),temaId:tema,fecha:hoyISO()});commit("Apunte guardado");break;
    case "link":if(!/^https?:\/\//i.test(String(fd.get("url")||"").trim())){toast("El link tiene que empezar con http:// o https://");return}m.apuntes.push({id:uid(),tipo:"link",titulo:String(fd.get("titulo")).trim(),url:String(fd.get("url")).trim(),temaId:tema,fecha:hoyISO()});commit("Link guardado");break;
    case "examen":{const file=fd.get("file"),url=String(fd.get("url")||"").trim(),btn=f.querySelector("button[type=submit]");
      if(url&&!/^https?:\/\//i.test(url)){toast("El link tiene que empezar con http:// o https://");return}
      const e={id:uid(),tipo:fd.get("tipo"),anio:+fd.get("anio")||"",titulo:String(fd.get("titulo")||"").trim(),temaIds:fd.getAll("temas"),notas:String(fd.get("notas")||"").trim(),url:url||"",fecha:hoyISO()};
      if(file&&file.size&&store.assets){btn.disabled=true;btn.textContent="Subiendo…";
        try{const r=await store.assets.upload(file,file.type?undefined:{type:"application/pdf"});e.assetId=r.id;if(!e.titulo)e.titulo=file.name}
        catch(err){console.error(err);btn.disabled=false;btn.textContent="Guardar";toast(err&&err.code==="too_large"?"El archivo supera 20 MB: comprimilo o dividilo.":err&&err.code==="unsupported_type"?"Ese tipo de archivo no se puede subir. Probá con PDF o imagen.":"No se pudo subir el archivo. Probá de nuevo.");return}}
      m.examenes.push(e);commit(e.temaIds.length?"Examen guardado":"Examen guardado. Marcá sus temas para que cuente en la frecuencia.");break}
    case "pdf":{const file=fd.get("file");if(!file||!file.size||!store.assets)return;const btn=f.querySelector("button[type=submit]");btn.disabled=true;btn.textContent="Subiendo…";
      try{const r=await store.assets.upload(file,file.type?undefined:{type:"application/pdf"});m.apuntes.push({id:uid(),tipo:"pdf",titulo:file.name,assetId:r.id,temaId:tema,fecha:hoyISO()});commit("Archivo subido")}
      catch(err){console.error(err);btn.disabled=false;btn.textContent="Subir";toast(err&&err.code==="too_large"?"El archivo supera 20 MB: comprimilo o dividilo.":err&&err.code==="unsupported_type"?"Ese tipo de archivo no se puede subir. Probá con PDF o imagen.":"No se pudo subir el archivo. Probá de nuevo.")}
      break}
    case "horas":{const mm=getM(fd.get("mid")),min=+fd.get("min");if(!mm||!min)return;mm.sesiones.push({id:uid(),fecha:fd.get("fecha")||hoyISO(),min,nota:String(fd.get("nota")||"").trim()});commit("Registraste "+hm(min)+" de "+mm.nombre);break}
    case "extra":{const n=String(fd.get("nombre")).trim();if(!n)return;state.carrera.extras.push({id:uid(),nombre:n,estado:"pendiente",nota:null});ui.refocus="f-extra";commit("Electiva agregada");break}
    case "ficha":{const q=String(fd.get("q")||"").trim(),an=String(fd.get("a")||"").trim();if(!q||!an)return;const h=hoyISO();m.fichas.push({id:uid(),q,a:an,temaId:tema,rep:0,prox:h,creada:h});ui.refocus="fi-q";commit("Ficha guardada");break}
    case "login":{const email=String(fd.get("email")||"").trim();if(!email)return;const msg=$("#lg-msg"),btn=f.querySelector("button");btn.disabled=true;
      const{error}=await sb.auth.signInWithOtp({email,options:{emailRedirectTo:location.origin+location.pathname}});btn.disabled=false;
      msg.textContent=error?("No se pudo mandar el mail: "+error.message):"Listo: revisá tu mail (y la carpeta de spam) y tocá el link desde este mismo dispositivo.";break}
    case "mesa":{const nm=String(fd.get("nombre")||"").trim(),de=fd.get("desde");if(!nm||!de)return;state.config.mesas.push({id:uid(),nombre:nm,desde:de,hasta:fd.get("hasta")||"",inscHasta:fd.get("inscHasta")||""});commit("Turno agregado");break}
    case "clase":{const de=fd.get("desde"),ha=fd.get("hasta");if(!de||!ha||toMin(ha)<=toMin(de)){toast("Revisá el horario: la clase tiene que terminar después de empezar.");return}const esAct=fd.get("mid")==="__act",nom=String(fd.get("nombre")||"").trim();if(esAct&&!nom){toast("Poné un nombre para la actividad, por ejemplo: Gym.");return}
      state.config.horario.push({id:uid(),tipo:esAct?"act":"clase",mid:esAct?"":fd.get("mid"),nombre:esAct?nom:"",dia:fd.get("dia"),desde:de,hasta:ha,lugar:String(fd.get("lugar")||"").trim()});commit((esAct?nom:"Clase")+" agregada: el plan se reajustó");break}
    case "aplazo":{const nn=+fd.get("n");if(!nn)return;state.historial.push({id:uid(),fecha:fd.get("fecha")||hoyISO(),n:nn,nombre:nomC(nn),res:"aplazo",nota:+fd.get("nota")||2});commit("Aplazo registrado");break}
    case "exc":{const fe=fd.get("fecha");if(!fe)return;state.config.excepciones=state.config.excepciones.filter(x=>x.fecha!==fe);state.config.excepciones.push({fecha:fe,min:Math.max(0,+fd.get("min")||0),motivo:String(fd.get("motivo")||"").trim()});commit("Plan reajustado para el "+fechaCorta(fe));break}
  }
});
window.addEventListener("hashchange",route);
route();
initStore();
})();
</script>
